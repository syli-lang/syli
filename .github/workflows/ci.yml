name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5.0

      - run: opam install . --deps-only --with-test

      - run: opam exec -- dune build

      - name: Install LLVM + Ninja (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18 ninja-build libunwind-dev
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install LLVM + Ninja (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: |
          LLVM_FORMULA=$(
            brew list --formula |
            grep '^llvm@' |
            sort -V |
            tail -n1
          )
          echo "Linking $LLVM_FORMULA"
          brew link "$LLVM_FORMULA"
          echo "$(brew --prefix "$LLVM_FORMULA")/bin" >> "$GITHUB_PATH"

      - name: Build runtime
        run: |
          make -C runtime all
          make -C runtime test

      - name: Run all tests
        run: |
          source setup.sh
          opam exec -- dune test

  lint-fmt:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout tree
        uses: actions/checkout@v7
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5.0
      - uses: ocaml/setup-ocaml/lint-fmt@v3